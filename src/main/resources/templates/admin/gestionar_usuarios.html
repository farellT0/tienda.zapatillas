<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{a.titulo_usuarios}">Gestionar usuarios</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div th:insert="~{fragments/general :: menu}"></div>

<div class="contenido">
    <h1 th:text="#{a.h1_usuarios}">gestionar usuarios</h1>

    <div class="tabla-contenedor">
        <table class="tabla">
            <thead>
            <tr>
                <th th:text="#{a.id}">ID</th>
                <th th:text="#{a.nombre}">Nombre</th>
                <th th:text="#{a.email}">Email</th>
                <th th:text="#{a.avatar}">Avatar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}"></td>
                <td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.email}"></td>
                <td>
                    <img th:if="${usuario.avatar != null}"
                         th:src="@{/mostrar_imagen_usuario(id=${usuario.id})}"
                         alt="Avatar" style="width:40px;height:40px;border-radius:50%;object-fit:cover">
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="4" th:text="#{a.sin_usuarios}">Todavía no hay usuarios registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
