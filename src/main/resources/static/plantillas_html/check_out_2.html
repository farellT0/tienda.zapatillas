<section>
    <h2 class="text-xl font-black mb-4">{{t.pago_titulo}}</h2>
    <form id="checkout-paso2" class="formulario" novalidate>
        <div class="campo">
            <label for="checkout-tipo-tarjeta">{{t.tipo_tarjeta}}</label>
            <select id="checkout-tipo-tarjeta" name="tipoTarjeta" required>
                <option value="">{{t.selecciona_tarjeta}}</option>
                <option value="VISA">VISA</option>
                <option value="MASTER CARD">MASTER CARD</option>
            </select>
        </div>
        <div class="campo">
            <label for="checkout-numero">{{t.numero_tarjeta}}</label>
            <input id="checkout-numero" name="numero" type="text" inputmode="numeric"
                   pattern="[0-9]{13,19}" minlength="13" maxlength="19" required>
        </div>
        <div class="campo">
            <label for="checkout-titular">{{t.titular}}</label>
            <input id="checkout-titular" name="titular" type="text" required>
        </div>
        <div class="campo">
            <label for="checkout-fecha-caducidad">{{t.fecha_caducidad}} ({{t.formato_fecha}})</label>
            <input id="checkout-fecha-caducidad" name="fechaCaducidad" type="text"
                   inputmode="numeric" placeholder="{{t.formato_fecha}}" pattern="(0[1-9]|1[0-2])/[0-9]{2}"
                   maxlength="5" required>
        </div>
        <p id="checkout-error" class="text-sm text-red-700" role="alert"></p>
        <button class="boton" type="submit">{{t.continuar}}</button>
    </form>
</section>
